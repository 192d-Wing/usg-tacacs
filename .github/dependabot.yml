# Dependabot configuration
# NIST SP 800-53 Rev. 5 controls: SA-15 (Development Process), RA-5 (Vulnerability
# Monitoring and Scanning), SI-2 (Flaw Remediation), CM-2 (Baseline Configuration).
# Automated dependency update monitoring for supply-chain hygiene.
version: 2
updates:
  # Rust / Cargo — the workspace root covers all member crates.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by CI and release workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"

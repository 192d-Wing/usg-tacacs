# SPDX-License-Identifier: Apache-2.0
# CI/CD Pipeline for usg-tacacs
# Migrated from .gitlab-ci.yml — preserves all stages and compliance checks.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: # manual trigger for benchmarks
  schedule:
    - cron: "0 3 * * *" # nightly at 03:00 UTC

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # opt into Node.js 24 (silence Node 20 deprecation)

jobs:
  # ==========================================================================
  # Stage 1: Validation (Fast Checks)
  # ==========================================================================

  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  helm-management-security:
    name: Helm Management Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - run: ./scripts/ci/validate-management-chart.sh

  # ==========================================================================
  # Stage 2: Build
  # ==========================================================================

  build-debug:
    name: Build (Debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-features

  server-container:
    name: Server Container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: container/Dockerfile.arm64
          target: builder
          push: false
          cache-from: type=gha,scope=server-container-amd64
          cache-to: type=gha,scope=server-container-amd64,mode=max

  build-release:
    name: Build (Release)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --all-features
      - uses: actions/upload-artifact@v7
        with:
          name: usg-tacacs-server
          path: target/release/usg-tacacs-server
          retention-days: 7

  # ==========================================================================
  # Stage 3: Testing
  # ==========================================================================

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features --lib

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features --test '*'

  jit-postgres-tests:
    name: JIT PostgreSQL Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p usg-tacacs-server --bin usg-tacacs-server postgres_
      - run: cargo test -p usg-tacacs-server --bin usg-tacacs-server jit_e2e_

  doc-tests:
    name: Doc Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features --doc

  # ==========================================================================
  # Stage 4: NASA Power of 10 & NIST Compliance
  # ==========================================================================

  nist-control-coverage:
    name: NIST Control Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate NIST headers
        run: |
          echo "=== NIST SP 800-53 Rev. 5 Control Coverage Validation ==="
          python3 scripts/generate-nist-headers.py --scan
          echo ""
          echo "=== Validating Header Coverage ==="
          python3 scripts/generate-nist-headers.py --validate > /tmp/nist-validation.txt 2>&1
          cat /tmp/nist-validation.txt
          if grep -q "missing NIST headers" /tmp/nist-validation.txt; then
            echo "FAIL: Some files with NIST control references are missing formal headers"
            exit 1
          else
            echo "PASS: All files with NIST controls have formal headers"
          fi

  nasa-rule4-function-length:
    name: NASA Rule 4 (Function Length)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate all functions <= 60 lines
        run: |
          chmod +x scripts/ci/validate-function-length.sh
          # The script exits non-zero on any violation and zero when clean,
          # so rely on its exit code directly (no fragile grep wrapper).
          ./scripts/ci/validate-function-length.sh --all 60 crates

  runtime-unwrap-check:
    name: Runtime Unwrap Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for unwrap in critical paths
        run: |
          chmod +x scripts/ci/validate-runtime-unwraps.sh
          ./scripts/ci/validate-runtime-unwraps.sh \
            crates/tacacs-server/src/auth.rs \
            crates/tacacs-server/src/server.rs \
            crates/tacacs-server/src/policy.rs

  rustdoc:
    name: Documentation Build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features
      - uses: actions/upload-artifact@v7
        with:
          name: rustdoc
          path: target/doc/
          retention-days: 7

  # ==========================================================================
  # Stage 5: Security Audits
  # ==========================================================================

  cargo-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --quiet cargo-audit
        # Accepted/mitigated advisories documented in audit.toml:
        #   RUSTSEC-2023-0071 (rsa Marvin) - no upstream fix; EST path disabled
        #   RUSTSEC-2025-0134 (rustls-pemfile unmaintained) - transitive
      # Vulnerabilities fail by default; explicitly fail on unsound advisories.
      # Yanked-only warnings remain visible without blocking when no compatible
      # replacement exists (see audit.toml for the spin 0.9.8 constraint).
      - run: cargo audit --deny unsound --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2025-0134

  cargo-deny:
    name: Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # ==========================================================================
  # Benchmarks (manual trigger)
  # ==========================================================================

  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --all-features
      - uses: actions/upload-artifact@v7
        with:
          name: criterion-reports
          path: target/criterion/
          retention-days: 7

  # ==========================================================================
  # Nightly Full Suite
  # ==========================================================================

  nightly:
    name: Nightly Full Suite
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features --all-targets
      - run: cargo install --quiet cargo-audit && cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2025-0134

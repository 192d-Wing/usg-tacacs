# Secret scanning gate. Blocks hardcoded credentials (e.g. the legacy TACACS+
# shared secret) from landing in the tracked tree. Uses the open-source gitleaks
# binary directly (the gitleaks-action requires a paid license for orgs).
#
# Scans the working tree (--no-git): a fresh checkout contains only tracked
# files, so generated/gitignored paths (target/, pki/) are absent. History is
# intentionally not scanned (the legacy secret pre-dates rotation and the
# history rewrite was deferred); the pre-commit hook + this gate stop new leaks.
#
# NIST SP 800-53 Rev. 5: SA-11, IA-5, SC-12.
name: secret-scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install gitleaks
        run: |
          VER=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan tracked tree for secrets
        run: gitleaks detect --no-git --source . --config .gitleaks.toml --redact -v

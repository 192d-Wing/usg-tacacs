# Secret scanning gate. Blocks hardcoded credentials (e.g. the legacy TACACS+
# shared secret) from merging. NIST SP 800-53 Rev. 5: SA-11, IA-5, SC-12.
name: secret-scan

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

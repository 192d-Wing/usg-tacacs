# Standalone (not part of the server workspace) so it builds independently and
# in the UI Docker context.
[workspace]

[package]
name = "tacacs-ui-bff"
version = "0.79.0"
edition = "2021"
license = "Apache-2.0"
description = "Backend-for-frontend for the usg-tacacs operator UI: aggregates Loki (audit/flows), Prometheus (metrics/resources), and computed alerts; serves the Cloudscape SPA."

[[bin]]
name = "tacacs-ui-bff"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tower-http = { version = "0.6", features = ["fs", "trace", "set-header"] }
# HTTP only (in-cluster Loki/Prometheus over http://) — no TLS backend needed,
# which keeps the musl build free of aws-lc-sys/ring.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = "debuginfo"
lto = "thin"

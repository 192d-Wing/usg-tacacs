# Copy this directory to deploy/sites/<site-name>. Real site directories are
# ignored by Git because they contain infrastructure identifiers.
image:
  tag: REPLACE_WITH_RELEASE
  digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

workloads:
  management:
    enabled: true
    replicaCount: 2
  legacy:
    enabled: true
    replicaCount: 3
  tls:
    enabled: false
    replicaCount: 3

nads:
  - identity: oopl-an-001
    sourceIp: 192.0.2.1
    description: IOS-XE lab switch
    mode: legacy
    secretFile: /run/secrets/tacacs/oopl-an-001

postgres:
  url: postgresql://tacacs_jit@tacacs-db-rw:5432/tacacs?sslmode=verify-full

secrets:
  postgresCredentials: tacacs-postgres-runtime
  postgresCa: tacacs-db-ca

pki:
  enabled: true
  issuerRef:
    name: enterprise-est
    kind: EstIssuer
    group: pki.usg.mil
  issuer:
    create: true
    serverUrl: https://est.example.mil/.well-known/est
    authentication:
      trustSecretName: est-server-trust
      method: mutualTls
      secretName: est-bootstrap-identity
    policy:
      allowedDnsSuffixes:
        - lab.example.mil
        - tacacs.svc.cluster.local
      maxDnsSans: 10
      maxDuration: 720h
  management:
    enabled: true
    secretName: tacacs-management-tls
    commonName: tacacs-management.example.mil
    dnsNames:
      - tacacs-management.example.mil
      - usg-tacacs-management.tacacs.svc
      - usg-tacacs-management.tacacs.svc.cluster.local
  dataPlane:
    enabled: true
    secretName: tacacs-dataplane-tls
    commonName: tacacs.example.mil
    dnsNames:
      - tacacs.example.mil
      - usg-tacacs-tls.tacacs.svc
      - usg-tacacs-tls.tacacs.svc.cluster.local
  ui:
    enabled: true
    secretName: tacacs-ui-tls
    commonName: tacacs-ui.example.mil
    dnsNames:
      - tacacs-ui.example.mil

service:
  legacyLoadBalancerIP: 192.0.2.2
  tlsLoadBalancerIP: 192.0.2.3

management:
  subjects:
    - certificateIdentity: cn:tacacs-admin.example.mil
      role: admin
    - certificateIdentity: dns:jitpw-api.jitpw-system.svc
      role: jitpw-issuer
    - certificateIdentity: dns:jitpw-audit.jitpw-system.svc
      role: jitpw-auditor

networkPolicy:
  managementPeers:
    - namespace: jitpw-system
      podLabels:
        app.kubernetes.io/name: jitpw-api
    - namespace: jitpw-system
      podLabels:
        app.kubernetes.io/name: jitpw-recovery-worker

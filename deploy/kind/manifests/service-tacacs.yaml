# TACACS+ Service exposed as a LoadBalancer.
#
# Cilium provides the load balancing (per-node eBPF, kube-proxy replacement) and
# assigns the external IP from a CiliumLoadBalancerIPPool, advertised via L2
# announcements (ARP) — this is the anycast/LB path that replaces HAProxy + BGP.
#
# Explicit nodePorts (30049/30300) are mapped to host 49/300 by kind so the
# service is also reachable from the Mac (Docker Desktop does not route the
# LoadBalancer IP subnet to the host).
apiVersion: v1
kind: Service
metadata:
  name: tacacs
  namespace: tacacs
  labels:
    app.kubernetes.io/name: tacacs
spec:
  type: LoadBalancer
  # Local: serve NodePort/LB traffic from a node-local backend only. Avoids the
  # cross-node SNAT return path that breaks the handshake in kind, and preserves
  # the client source IP. Requires a TACACS pod on the ingress (control-plane)
  # node — guaranteed by the Deployment's toleration + per-node anti-affinity.
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: tacacs
  ports:
    - { name: legacy, port: 49, targetPort: 49, nodePort: 30049 }
    - { name: tls, port: 300, targetPort: 300, nodePort: 30300 }

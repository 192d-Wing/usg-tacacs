# TACACS+ server Deployment.
#
# Configured entirely via CLI flags (the binary has no --config file loader).
# Listens on legacy plaintext :49, TLS/mTLS :300, and HTTP health/metrics :8080.
#
# NIST SP 800-53 Rev. 5: SC-8 (TLS), AC-3 (mTLS client CA), AC-6/CM-6
# (non-root, dropped capabilities, read-only rootfs).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tacacs
  namespace: tacacs
  labels:
    app.kubernetes.io/name: tacacs
spec:
  replicas: 2
  # One pod per node (anti-affinity) + only 2 nodes means a surge pod has
  # nowhere to schedule; recreate in place instead.
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tacacs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tacacs
    spec:
      # No Kubernetes API access required for this configuration (AC-6).
      automountServiceAccountToken: false
      # Spread one replica per node (incl. the control-plane ingress node) so
      # externalTrafficPolicy: Local always has a node-local backend.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: tacacs
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: tacacs
          image: usg-tacacs:kind
          imagePullPolicy: IfNotPresent
          args:
            - "--listen-legacy"
            - "0.0.0.0:49"
            - "--listen-tls"
            - "0.0.0.0:300"
            - "--listen-http"
            - "0.0.0.0:8080"
            - "--tls-cert"
            - "/etc/tacacs/tls/server.pem"
            - "--tls-key"
            - "/etc/tacacs/tls/server-key.pem"
            - "--client-ca"
            - "/etc/tacacs/tls/ca.pem"
            - "--policy"
            - "/etc/tacacs/policy/policy.json"
            - "--schema"
            - "/etc/tacacs/policy/policy.schema.json"
            - "--allow-static-credentials"
            - "--user-password"
            - "testadmin:Tac@cs-Priv15"
            - "--user-password"
            - "alice:alicepass"
          env:
            # The server reads the shared secret from TACACS_SECRET (the
            # --secret-file flag is parsed but not wired to the obfuscation
            # secret in the current binary). Sourced from the tacacs-tls Secret.
            - name: TACACS_SECRET
              valueFrom:
                secretKeyRef:
                  name: tacacs-tls
                  key: secret
          ports:
            - { name: legacy, containerPort: 49 }
            - { name: tls, containerPort: 300 }
            - { name: http, containerPort: 8080 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          resources:
            requests: { memory: "256Mi", cpu: "100m", ephemeral-storage: "64Mi" }
            limits: { memory: "1Gi", cpu: "1000m", ephemeral-storage: "256Mi" }
          # Use the HTTP health endpoints rather than a TCP probe on :49, which
          # would open a real TACACS+ connection every period.
          startupProbe:
            httpGet: { path: /live, port: 8080 }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /live, port: 8080 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /ready, port: 8080 }
            periodSeconds: 10
          volumeMounts:
            - { name: tls, mountPath: /etc/tacacs/tls, readOnly: true }
            - { name: policy, mountPath: /etc/tacacs/policy, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tls
          secret:
            secretName: tacacs-tls
        - name: policy
          configMap:
            name: tacacs-policy
        - name: tmp
          emptyDir: {}

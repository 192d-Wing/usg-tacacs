# Cilium Helm values for kind: CNI + kube-proxy replacement + service load
# balancing + LoadBalancer-IP advertisement via L2 announcements (no BGP).
#
# kube-proxy is disabled, so Cilium needs the apiserver address directly.
# k8sServiceHost is injected at install time by up.sh as the control-plane
# node's container IP (the hostname `kind-control-plane` is not resolvable from
# the agent's host-network namespace via Docker Desktop DNS).
kubeProxyReplacement: true
k8sServicePort: 6443

# Service exposure: NodePort is used to reach the LB from the Mac (via kind
# port mappings); L2 announcements advertise LoadBalancer IPs on the L2 segment.
nodePort:
  enabled: true
externalIPs:
  enabled: true
l2announcements:
  enabled: true

# L2 announcements lease churn can hit client-side rate limits; raise them.
k8sClientRateLimit:
  qps: 20
  burst: 40

operator:
  replicas: 1

ipam:
  mode: kubernetes

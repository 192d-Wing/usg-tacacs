workloads:
  management:
    enabled: true
    replicaCount: 2
  legacy:
    enabled: true
    replicaCount: 3
  tls:
    enabled: false
    replicaCount: 3

image:
  repository: ghcr.io/192d-wing/usg-tacacs-server
  tag: REPLACE_WITH_RELEASE
  digest: ""
  pullPolicy: IfNotPresent

configuration:
  description: Site TACACS service
  # Enable after all referenced Secret keys are present in the mounted volumes.
  checkFiles: false

nads:
  - identity: oopl-an-001
    sourceIp: 192.0.2.1
    description: IOS-XE lab switch
    mode: legacy
    secretFile: /run/secrets/tacacs/oopl-an-001

postgres:
  url: postgresql://tacacs_jit@REPLACE_POSTGRES_HOST:5432/tacacs?sslmode=verify-full

secrets:
  runtime: tacacs-runtime
  postgresCredentials: tacacs-postgres-runtime
  managementClientCa: tacacs-management-client-ca
  dataPlaneClientCa: tacacs-dataplane-client-ca
  postgresCa: tacacs-postgres-ca

pki:
  # When enabled, the chart creates cert-manager Certificate resources.
  enabled: false
  issuerRef:
    name: enterprise-est
    kind: EstIssuer
    group: pki.usg.mil
  issuer:
    # Creates the namespace-local EstIssuer named by issuerRef.name. Referenced
    # trust and bootstrap identity Secrets must already exist in the namespace.
    create: false
    serverUrl: https://est.example.mil/.well-known/est
    authentication:
      trustSecretName: est-server-trust
      method: mutualTls
      secretName: est-bootstrap-identity
    policy:
      allowedDnsSuffixes:
        - example.mil
        - tacacs.svc.cluster.local
      maxDnsSans: 10
      maxDuration: 720h
  duration: 720h
  renewBefore: 168h
  privateKey:
    algorithm: ECDSA
    size: 384
    rotationPolicy: Always
  management:
    enabled: true
    secretName: tacacs-management-tls
    commonName: tacacs-management.example.mil
    dnsNames:
      - tacacs-management.example.mil
      - usg-tacacs-management.tacacs.svc
      - usg-tacacs-management.tacacs.svc.cluster.local
  dataPlane:
    enabled: true
    secretName: tacacs-dataplane-tls
    commonName: tacacs.example.mil
    dnsNames:
      - tacacs.example.mil
      - usg-tacacs-tls.tacacs.svc
      - usg-tacacs-tls.tacacs.svc.cluster.local
  ui:
    enabled: true
    secretName: tacacs-ui-tls
    commonName: tacacs-ui.example.mil
    dnsNames:
      - tacacs-ui.example.mil

service:
  type: LoadBalancer
  legacyLoadBalancerIP: ""
  tlsLoadBalancerIP: ""
  ipFamilyPolicy: SingleStack
  ipFamilies: [IPv4]
  labels: {}
  annotations: {}
  loadBalancerAnnotations: {}

management:
  subjects:
    - certificateIdentity: cn:tacacs-admin.example.mil
      role: admin
    - certificateIdentity: dns:jitpw-api.jitpw-system.svc
      role: jitpw-issuer
    - certificateIdentity: dns:jitpw-audit.jitpw-system.svc
      role: jitpw-auditor

authorization:
  privilegedGroups:
    - netops

networkPolicy:
  enabled: true
  postgresClusterName: tacacs-db
  dns:
    namespace: kube-system
    podLabels:
      k8s-app: kube-dns
  managementPeers:
    - namespace: jitpw-system
      podLabels:
        app.kubernetes.io/name: jitpw-api
    - namespace: jitpw-system
      podLabels:
        app.kubernetes.io/name: jitpw-recovery-worker

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

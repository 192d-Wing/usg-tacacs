workloads:
  management:
    enabled: true
    replicaCount: 2
  legacy:
    enabled: true
    replicaCount: 3
  tls:
    enabled: false
    replicaCount: 3

image:
  repository: ghcr.io/192d-wing/usg-tacacs-server
  tag: REPLACE_WITH_RELEASE
  digest: ""
  pullPolicy: IfNotPresent

configuration:
  description: Site TACACS service
  # Enable after all referenced Secret keys are present in the mounted volumes.
  checkFiles: false

nads:
  - identity: oopl-an-001
    sourceIp: 192.0.2.1
    description: IOS-XE lab switch
    mode: legacy
    secretFile: /run/secrets/tacacs/oopl-an-001

postgres:
  url: postgresql://tacacs_jit@REPLACE_POSTGRES_HOST:5432/tacacs?sslmode=verify-full

secrets:
  runtime: tacacs-runtime
  apiTls: tacacs-api-tls
  dataPlaneTls: tacacs-dataplane-tls
  postgresCa: tacacs-postgres-ca

est:
  management:
    enabled: false
    serverUrl: ""
    commonName: ""
    dnsSans: []
    organization: ""
    caLabel: ""
    bootstrapSecret: tacacs-est-bootstrap
    authentication: basic
    username: ""
    renewalThreshold: 70
    renewalCheckIntervalSeconds: 3600
    bootstrapTimeoutSeconds: 300

service:
  type: LoadBalancer
  legacyLoadBalancerIP: ""
  tlsLoadBalancerIP: ""
  annotations: {}

management:
  subjects:
    - certificateIdentity: cn:tacacs-admin.example.mil
      role: admin
    - certificateIdentity: dns:jitpw-api.jitpw-system.svc
      role: jitpw-issuer
    - certificateIdentity: dns:jitpw-audit.jitpw-system.svc
      role: jitpw-auditor

authorization:
  privilegedGroups:
    - netops

networkPolicy:
  enabled: true
  managementPeers:
    - namespace: jitpw-system
      podLabels:
        app.kubernetes.io/name: jitpw-api
    - namespace: jitpw-system
      podLabels:
        app.kubernetes.io/name: jitpw-recovery-worker

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

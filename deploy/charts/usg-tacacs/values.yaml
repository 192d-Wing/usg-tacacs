replicaCount: 1

image:
  repository: ghcr.io/192d-wing/usg-tacacs-server
  tag: REPLACE_WITH_RELEASE
  digest: ""
  pullPolicy: IfNotPresent

configuration:
  description: Site TACACS service
  # Enable after all referenced Secret keys are present in the mounted volumes.
  checkFiles: false

nads:
  - identity: oopl-an-001
    sourceIp: 192.0.2.1
    description: IOS-XE lab switch
    secretFile: /run/secrets/tacacs/oopl-an-001

postgres:
  url: postgresql://tacacs_jit@REPLACE_POSTGRES_HOST:5432/tacacs?sslmode=verify-full

secrets:
  runtime: tacacs-runtime
  apiTls: tacacs-api-tls
  postgresCa: tacacs-postgres-ca

service:
  type: LoadBalancer
  loadBalancerIP: ""
  annotations: {}

management:
  adminCommonNames:
    - tacacs-admin.example.mil
  issuerCommonName: jitpw-api.jitpw-system.svc
  auditorCommonName: jitpw-audit.jitpw-system.svc

authorization:
  privilegedGroups:
    - netops

networkPolicy:
  enabled: true
  managementPodNames:
    - jitpw-api
    - jitpw-recovery-worker

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

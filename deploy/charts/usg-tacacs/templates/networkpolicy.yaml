{{- if .Values.networkPolicy.enabled }}
{{- range $index, $role := list "management" "legacy" "tls" }}
{{- $workload := index $.Values.workloads $role }}
{{- if $workload.enabled }}
{{- if $index }}
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "usg-tacacs.name" $ }}-{{ $role }}
  labels:
    {{- include "usg-tacacs.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
spec:
  podSelector:
    matchLabels:
      {{- include "usg-tacacs.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $role }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- if eq $role "management" }}
        {{- range $.Values.networkPolicy.managementPeers }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace | quote }}
          {{- with .podLabels }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
        {{- end }}
        {{- else }}
        {{- range $.Values.nads }}
        - ipBlock:
            cidr: {{ printf "%s/%d" .sourceIp (ternary 128 32 (contains ":" .sourceIp)) | quote }}
        {{- end }}
        {{- end }}
      ports:
        {{- if eq $role "management" }}
        - { protocol: TCP, port: 8443 }
        {{- else if eq $role "legacy" }}
        - { protocol: TCP, port: 49 }
        {{- else }}
        - { protocol: TCP, port: 300 }
        {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ $.Values.networkPolicy.postgresClusterName }}
      ports:
        - { protocol: TCP, port: 5432 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.networkPolicy.dns.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml $.Values.networkPolicy.dns.podLabels | nindent 14 }}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
{{- end }}
{{- end }}
{{- end }}

{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "usg-tacacs.name" . }}
  labels:
    {{- include "usg-tacacs.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "usg-tacacs.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range .Values.nads }}
        - ipBlock:
            cidr: {{ printf "%s/32" .sourceIp }}
        {{- end }}
      ports:
        - { protocol: TCP, port: 49 }
    - from:
        {{- range .Values.networkPolicy.managementPeers }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .podLabels | nindent 14 }}
        {{- end }}
      ports:
        - { protocol: TCP, port: 8443 }
{{- end }}

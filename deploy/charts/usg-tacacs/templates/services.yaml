{{- range $index, $role := list "management" "legacy" "tls" }}
{{- $workload := index $.Values.workloads $role }}
{{- if $workload.enabled }}
{{- if $index }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "usg-tacacs.name" $ }}-{{ $role }}
  labels:
    {{- include "usg-tacacs.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
    {{- with $.Values.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if or $.Values.service.annotations (and (ne $role "management") $.Values.service.loadBalancerAnnotations) }}
  annotations:
    {{- with $.Values.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if ne $role "management" }}
    {{- with $.Values.service.loadBalancerAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- end }}
  {{- end }}
spec:
  type: {{ ternary "ClusterIP" $.Values.service.type (eq $role "management") }}
  ipFamilyPolicy: {{ $.Values.service.ipFamilyPolicy }}
  ipFamilies:
    {{- toYaml $.Values.service.ipFamilies | nindent 4 }}
  {{- if ne $role "management" }}
  externalTrafficPolicy: Local
  {{- $address := ternary $.Values.service.legacyLoadBalancerIP $.Values.service.tlsLoadBalancerIP (eq $role "legacy") }}
  {{- with $address }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- end }}
  selector:
    {{- include "usg-tacacs.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
  ports:
    {{- if eq $role "management" }}
    - { name: https, port: 8443, targetPort: management }
    {{- else if eq $role "legacy" }}
    - { name: tacacs, port: 49, targetPort: legacy }
    {{- else }}
    - { name: tacacss, port: 300, targetPort: tls }
    {{- end }}
{{- end }}
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "usg-tacacs.name" . }}
  labels:
    {{- include "usg-tacacs.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "usg-tacacs.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "usg-tacacs.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: validate-configuration
          image: {{ include "usg-tacacs.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /usr/local/bin/usg-tacacs-config-check
          args:
            - /etc/usg-tacacs/server.yaml
            {{- if .Values.configuration.checkFiles }}
            - --check-files
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: configuration, mountPath: /etc/usg-tacacs, readOnly: true }
            - { name: runtime-secrets, mountPath: /run/secrets/tacacs, readOnly: true }
            - { name: api-tls, mountPath: /run/tls/api, readOnly: true }
            - { name: postgres-ca, mountPath: /run/tls/postgres, readOnly: true }
      containers:
        - name: tacacs
          image: {{ include "usg-tacacs.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config
            - /etc/usg-tacacs/server.yaml
            - --log-format
            - json
          ports:
            - { name: tacacs, containerPort: 49 }
            - { name: management, containerPort: 8443 }
            - { name: health, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /ready, port: health }
          livenessProbe:
            httpGet: { path: /live, port: health }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          volumeMounts:
            - { name: configuration, mountPath: /etc/usg-tacacs, readOnly: true }
            - { name: runtime-secrets, mountPath: /run/secrets/tacacs, readOnly: true }
            - { name: api-tls, mountPath: /run/tls/api, readOnly: true }
            - { name: postgres-ca, mountPath: /run/tls/postgres, readOnly: true }
            - { name: temporary, mountPath: /tmp }
      volumes:
        - name: configuration
          configMap:
            name: {{ include "usg-tacacs.name" . }}-configuration
        - name: runtime-secrets
          secret:
            secretName: {{ .Values.secrets.runtime }}
        - name: api-tls
          secret:
            secretName: {{ .Values.secrets.apiTls }}
        - name: postgres-ca
          secret:
            secretName: {{ .Values.secrets.postgresCa }}
        - name: temporary
          emptyDir: {}

{{- range $index, $role := list "management" "legacy" "tls" }}
{{- $workload := index $.Values.workloads $role }}
{{- if $workload.enabled }}
{{- if $index }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "usg-tacacs.name" $ }}-{{ $role }}
  labels:
    {{- include "usg-tacacs.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
spec:
  replicas: {{ $workload.replicaCount }}
  selector:
    matchLabels:
      {{- include "usg-tacacs.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $role }}
  template:
    metadata:
      labels:
        {{- include "usg-tacacs.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $role }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: validate-configuration
          image: {{ include "usg-tacacs.image" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["/usr/local/bin/usg-tacacs-config-check"]
          args:
            - /etc/usg-tacacs/server.yaml
            {{- if $.Values.configuration.checkFiles }}
            - --check-files
            {{- end }}
          securityContext: &security
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts: &mounts
            - { name: configuration, mountPath: /etc/usg-tacacs, readOnly: true }
            - { name: runtime-secrets, mountPath: /run/secrets/tacacs, readOnly: true }
            - { name: postgres-credentials, mountPath: /run/secrets/postgres, readOnly: true }
            - { name: postgres-ca, mountPath: /run/tls/postgres, readOnly: true }
            {{- if eq $role "management" }}
            - { name: management-tls, mountPath: /run/tls/management, readOnly: true }
            - { name: management-client-ca, mountPath: /run/trust/management-client, readOnly: true }
            {{- else if eq $role "tls" }}
            - { name: dataplane-tls, mountPath: /run/tls/dataplane, readOnly: true }
            - { name: dataplane-client-ca, mountPath: /run/trust/dataplane-client, readOnly: true }
            {{- end }}
      containers:
        - name: tacacs
          image: {{ include "usg-tacacs.image" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
            - name: JIT_MANAGED_NADS
              value: {{ include "usg-tacacs.managedNads" $ | quote }}
            - name: JIT_LEGACY_NADS
              value: {{ include "usg-tacacs.legacyNads" $ | quote }}
          args: ["--config", "/etc/usg-tacacs/server.yaml", "--log-format", "json"]
          ports:
            {{- if eq $role "management" }}
            - { name: management, containerPort: 8443 }
            {{- else if eq $role "legacy" }}
            - { name: legacy, containerPort: 49 }
            {{- else }}
            - { name: tls, containerPort: 300 }
            {{- end }}
            - { name: health, containerPort: 8080 }
          readinessProbe: { httpGet: { path: /ready, port: health } }
          livenessProbe: { httpGet: { path: /live, port: health } }
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          securityContext:
            <<: *security
            capabilities:
              drop: ["ALL"]
              {{- if eq $role "legacy" }}
              add: ["NET_BIND_SERVICE"]
              {{- end }}
          volumeMounts: *mounts
      volumes:
        - name: configuration
          configMap:
            name: {{ include "usg-tacacs.name" $ }}-{{ $role }}-configuration
        - name: runtime-secrets
          secret: { secretName: {{ $.Values.secrets.runtime }} }
        - name: postgres-credentials
          secret:
            secretName: {{ $.Values.secrets.postgresCredentials }}
            items:
              - { key: password, path: postgres-password }
        - name: postgres-ca
          secret: { secretName: {{ $.Values.secrets.postgresCa }} }
        {{- if eq $role "management" }}
        - name: management-tls
          secret: { secretName: {{ $.Values.pki.management.secretName }} }
        - name: management-client-ca
          secret: { secretName: {{ $.Values.secrets.managementClientCa }} }
        {{- else if eq $role "tls" }}
        - name: dataplane-tls
          secret: { secretName: {{ $.Values.pki.dataPlane.secretName }} }
        - name: dataplane-client-ca
          secret: { secretName: {{ $.Values.secrets.dataPlaneClientCa }} }
        {{- end }}
{{- end }}
{{- end }}

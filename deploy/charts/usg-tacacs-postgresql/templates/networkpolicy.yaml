{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.cluster.name }}
  labels:
    {{- include "usg-tacacs-postgresql.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ .Values.cluster.name }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ .Values.cluster.name }}
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.tacacsPodLabels | nindent 14 }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: migration
      ports:
        - { protocol: TCP, port: 5432 }
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.operator.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.operator.podLabels | nindent 14 }}
      ports:
        - { protocol: TCP, port: 8000 }
{{- end }}


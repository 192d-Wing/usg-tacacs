{{- if .Values.secrets.create }}
# WARNING: templated Secrets place sensitive values in the release manifest and
# Helm history. Prefer external-secrets / sealed-secrets / SOPS and leave
# secrets.create=false in production. Provided for dev/CI convenience only.
{{- if .Values.secrets.tls }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretNames.tls }}
  namespace: {{ include "usg-tacacs.namespace" . }}
  labels:
    {{- include "usg-tacacs.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- toYaml .Values.secrets.tls | nindent 2 }}
{{- end }}
{{- if and .Values.config.icam.enabled .Values.secrets.icam }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretNames.icam }}
  namespace: {{ include "usg-tacacs.namespace" . }}
  labels:
    {{- include "usg-tacacs.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- toYaml .Values.secrets.icam | nindent 2 }}
{{- end }}
{{- if and .Values.config.icam.enabled .Values.secrets.icamCa }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretNames.icamCa }}
  namespace: {{ include "usg-tacacs.namespace" . }}
  labels:
    {{- include "usg-tacacs.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- toYaml .Values.secrets.icamCa | nindent 2 }}
{{- end }}
{{- if and .Values.config.groupCache.url .Values.secrets.groupCache }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretNames.groupCache }}
  namespace: {{ include "usg-tacacs.namespace" . }}
  labels:
    {{- include "usg-tacacs.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- toYaml .Values.secrets.groupCache | nindent 2 }}
{{- end }}
{{- end }}

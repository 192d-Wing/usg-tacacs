{{- if .Values.serviceAccount.create }}
# AC-6 least privilege: dedicated identity with no API token mounted. The TACACS
# server never calls the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "usg-tacacs.serviceAccountName" . }}
  namespace: {{ include "usg-tacacs.namespace" . }}
  labels:
    {{- include "usg-tacacs.labels" . | nindent 4 }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}

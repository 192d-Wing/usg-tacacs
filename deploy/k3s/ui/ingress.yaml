# Public exposure for tacacs-ui via Traefik: HTTPS-only, HTTP->HTTPS redirect,
# HSTS, and OIDC (Keycloak) forward-auth through oauth2-proxy.
#
# Prerequisites (operator-provided):
#   - DNS: tacacs-ui.oopl.dev.mil -> 10.10.10.54 (Traefik LB)
#   - TLS Secret `tacacs-ui-tls` (cert+key for the host) in namespace tacacs
#   - oauth2-proxy configured with a Keycloak client (see oauth2-proxy.yaml)
---
# Force HTTP -> HTTPS.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
  namespace: tacacs
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# HSTS + sane security headers.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: tacacs
spec:
  headers:
    stsSeconds: 63072000
    stsIncludeSubdomains: true
    stsPreload: true
    forceSTSHeader: true
    contentTypeNosniff: true
    browserXssFilter: true
    referrerPolicy: "strict-origin-when-cross-origin"
    frameDeny: true
---
# OIDC gate: defer auth to oauth2-proxy; forward identity headers to the UI.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oidc-auth
  namespace: tacacs
spec:
  forwardAuth:
    address: http://oauth2-proxy.tacacs.svc/oauth2/auth
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - X-Auth-Request-Groups
---
# HTTPS-only Ingress (websecure entrypoint) with the middleware chain.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tacacs-ui
  namespace: tacacs
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: >-
      tacacs-security-headers@kubernetescrd,tacacs-oidc-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: ["tacacs-ui.oopl.dev.mil"]
      secretName: tacacs-ui-tls
  rules:
    - host: tacacs-ui.oopl.dev.mil
      http:
        paths:
          # oauth2-proxy's own callback/sign-in routes (no auth middleware).
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port: { number: 80 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tacacs-ui
                port: { number: 80 }
---
# Companion HTTP Ingress that only redirects to HTTPS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tacacs-ui-redirect
  namespace: tacacs
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: tacacs-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: tacacs-ui.oopl.dev.mil
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tacacs-ui
                port: { number: 80 }

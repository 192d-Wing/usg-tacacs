# NIST SP 800-53 Rev5: AC-3 (Access Enforcement), AC-4 (Information Flow
# Enforcement), SC-5 (DoS Protection), SC-7 (Boundary Protection),
# IA-5 (Authenticator Management).
#
# Valkey (Redis-wire-compatible) backing the shared login→authz group cache.
# Pure in-memory cache: persistence is disabled (--save "" / --appendonly no),
# so a restart simply re-populates from subsequent logins. Password-protected
# and restricted to the tacacs pods via NetworkPolicy.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: tacacs
  labels: { app: valkey }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: valkey }
  template:
    metadata:
      labels: { app: valkey }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:8.1-alpine
          imagePullPolicy: IfNotPresent
          command:
            - "valkey-server"
            - "--requirepass"
            - "$(VALKEY_PASSWORD)"
            - "--save"
            - ""
            - "--appendonly"
            - "no"
            - "--maxmemory"
            - "128mb"
            - "--maxmemory-policy"
            - "allkeys-lru"
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tacacs-group-cache
                  key: password
          ports:
            - { name: valkey, containerPort: 6379 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { memory: "64Mi", cpu: "50m", ephemeral-storage: "16Mi" }
            limits: { memory: "192Mi", cpu: "500m", ephemeral-storage: "64Mi" }
          livenessProbe:
            tcpSocket: { port: 6379 }
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                ["sh", "-c", "valkey-cli -a \"$VALKEY_PASSWORD\" ping | grep -q PONG"]
            periodSeconds: 10
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: tacacs
  labels: { app: valkey }
spec:
  type: ClusterIP
  selector: { app: valkey }
  ports:
    - { name: valkey, port: 6379, targetPort: 6379 }
---
# SC-7 boundary protection: only the tacacs server pods may reach Valkey.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valkey-allow-tacacs
  namespace: tacacs
spec:
  podSelector:
    matchLabels: { app: valkey }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: tacacs }
      ports:
        - { protocol: TCP, port: 6379 }

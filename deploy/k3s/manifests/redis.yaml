# NIST SP 800-53 Rev5: AC-3 (Access Enforcement), AC-4 (Information Flow
# Enforcement), SC-5 (DoS Protection), SC-7 (Boundary Protection),
# IA-5 (Authenticator Management).
#
# Redis (Iron Bank hardened image) backing the shared login→authz group cache.
# Pure in-memory cache: persistence is disabled (--save "" / --appendonly no),
# so a restart simply re-populates from subsequent logins. Password-protected
# and restricted to the tacacs pods via NetworkPolicy.
#
# Image: registry1.dso.mil/ironbank/opensource/redis/redis8:8.8.0
# The Iron Bank image runs as the non-root "redis" user (uid/gid 997) and its
# entrypoint prepends "redis-server" to any flag arguments, so the cache flags
# are supplied via `args:` rather than overriding the hardened entrypoint.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: tacacs
  labels: { app: redis }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      # Iron Bank registry requires authentication; pull token lives in the
      # tacacs namespace as the registry1-pull dockerconfigjson Secret. Create it
      # once from a workstation logged in to registry1.dso.mil:
      #   kubectl -n tacacs create secret docker-registry registry1-pull \
      #     --docker-server=registry1.dso.mil \
      #     --docker-username=<robot-user> --docker-password=<cli-token>
      imagePullSecrets:
        - name: registry1-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 997
        runAsGroup: 997
        fsGroup: 997
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: registry1.dso.mil/ironbank/opensource/redis/redis8:8.8.0
          imagePullPolicy: IfNotPresent
          args:
            - "--requirepass"
            - "$(REDIS_PASSWORD)"
            - "--save"
            - ""
            - "--appendonly"
            - "no"
            - "--maxmemory"
            - "128mb"
            - "--maxmemory-policy"
            - "allkeys-lru"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tacacs-group-cache
                  key: password
          ports:
            - { name: redis, containerPort: 6379 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { memory: "64Mi", cpu: "50m", ephemeral-storage: "16Mi" }
            limits: { memory: "192Mi", cpu: "500m", ephemeral-storage: "64Mi" }
          livenessProbe:
            tcpSocket: { port: 6379 }
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
            periodSeconds: 10
          volumeMounts:
            # Iron Bank redis workdir / data dir; writable scratch so the root
            # filesystem can stay read-only (no persistence is written here).
            - { name: data, mountPath: /home/data }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: tacacs
  labels: { app: redis }
spec:
  type: ClusterIP
  selector: { app: redis }
  ports:
    - { name: redis, port: 6379, targetPort: 6379 }
---
# SC-7 boundary protection: only the tacacs server pods may reach Redis.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-allow-tacacs
  namespace: tacacs
spec:
  podSelector:
    matchLabels: { app: redis }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: tacacs }
      ports:
        - { protocol: TCP, port: 6379 }

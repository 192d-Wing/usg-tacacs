# Prometheus: scrapes the tacacs /metrics endpoints (via the headless
# tacacs-metrics Service) and the kubelet cAdvisor (container CPU/memory),
# proxied through the apiserver. Single replica, filesystem TSDB.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "nodes/metrics", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/tacacs-alerts.yml
    scrape_configs:
      # tacacs server /metrics via the headless tacacs-metrics Service endpoints.
      - job_name: tacacs
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: ["tacacs"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_label_monitoring]
            regex: tacacs
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: http-metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace

      # Container CPU/memory from each kubelet's cAdvisor, via the apiserver proxy.
      - job_name: kubelet-cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
  # Alerting rules. These FIRE in the Prometheus /alerts UI; to route them to
  # notifications, point an `alerting:`/Alertmanager (or Grafana alerting) at
  # this Prometheus. Thresholds are conservative starting points — tune per
  # environment. NIST: AU-6 (audit review/analysis/reporting), SI-4 (monitoring).
  tacacs-alerts.yml: |
    groups:
      - name: tacacs
        rules:
          # Availability: a scrape target (pod) is down/unscrapable.
          - alert: TacacsServerTargetDown
            expr: up{job="tacacs"} == 0
            for: 5m
            labels: { severity: critical }
            annotations:
              summary: "TACACS+ metrics target down ({{ $labels.pod }})"
              description: "Prometheus cannot scrape a tacacs pod for 5m — pod down or :8080 blocked."

          # Accounting rejections — would have caught the command-accounting bug.
          # Any sustained non-success accounting record points at a NAD/attribute
          # compatibility problem dropping accounting data.
          - alert: TacacsAccountingRejections
            expr: sum(rate(tacacs_acct_records_total{status!="success"}[5m])) > 0
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "TACACS+ accounting records being rejected"
              description: "Non-success accounting for 10m — likely NAD/attribute incompatibility (acct_rfc_invalid / acct_error). Check the audit log detail= field."

          # AC-7 lockouts firing: password spray OR a misconfigured/busy NAD
          # self-locking (per-source-IP limiter at --ip-lockout-limit).
          - alert: TacacsRateLimitLockouts
            expr: sum(rate(tacacs_ratelimit_rejections_total[5m])) > 0
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "TACACS+ rate-limit lockouts active"
              description: "Per-username/per-source-IP lockouts firing for 10m — possible spray, or a busy NAD exceeding --ip-lockout-limit (self-lock). Review and tune if legitimate."

          # Connection rejections: per-IP concurrency cap / session limits, or a
          # source blocked by the NetworkPolicy hammering the listener.
          - alert: TacacsConnectionRejections
            expr: sum(rate(tacacs_connections_rejected_total[5m])) > 0.2
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "TACACS+ connections being rejected"
              description: "Sustained connection rejections for 10m — per-IP concurrency cap, session limit, or an unauthorized source retrying."

          # Server-side auth errors (backend/ICAM failures), distinct from normal
          # bad-credential failures.
          - alert: TacacsAuthnErrors
            expr: sum(rate(tacacs_authn_requests_total{result="error"}[5m])) > 0
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "TACACS+ authentication errors"
              description: "Authn ERROR results for 10m — backend/ICAM failure rather than bad credentials. Check ICAM endpoint reachability."
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: monitoring
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels: { app: prometheus }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: prometheus
          image: prom/prometheus:v3.1.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=15d"
            - "--web.enable-lifecycle"
          ports:
            - { name: http, containerPort: 9090 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /-/ready, port: 9090 }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "512Mi" }
            limits: { cpu: "1000m", memory: "2Gi" }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data, mountPath: /prometheus }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: data
          persistentVolumeClaim: { claimName: prometheus-data }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels: { app: prometheus }
spec:
  type: ClusterIP
  selector: { app: prometheus }
  ports:
    - { name: http, port: 9090, targetPort: 9090 }

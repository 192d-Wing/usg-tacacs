openapi: 3.1.1
info:
  title: USG TACACS Management API
  version: 1.0.0
  description: Administrative API for operating a USG TACACS server. This contract does not expose JIT password lease operations.
servers:
  - url: https://tacacs.example.mil:8443/api/mgmt/v1
security:
  - mutualTLS: []
paths:
  /status:
    get:
      operationId: getStatus
      summary: Get server status
      responses:
        "200":
          description: Server status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "403":
          $ref: "#/components/responses/Forbidden"
  /sessions:
    get:
      operationId: listSessions
      summary: List active TACACS sessions
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sessions"
        "403":
          $ref: "#/components/responses/Forbidden"
  /sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    delete:
      operationId: deleteSession
      summary: Terminate an active TACACS session
      responses:
        "204":
          description: Session terminated
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /policy:
    get:
      operationId: getPolicy
      summary: Get the active authorization policy
      responses:
        "200":
          description: Active policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: replacePolicy
      summary: Validate and replace the authorization policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyUpload"
      responses:
        "200":
          description: Policy replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyUploadResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Policy upload is disabled by authoritative declarative configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyUploadResult"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
  /policy/reload:
    post:
      operationId: reloadPolicy
      summary: Reload the policy from its configured source
      responses:
        "202":
          description: Reload requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
  /config:
    get:
      operationId: getRuntimeConfig
      summary: Get the redacted runtime configuration
      responses:
        "200":
          description: Redacted configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeConfig"
        "403":
          $ref: "#/components/responses/Forbidden"
  /config/effective:
    get:
      operationId: getEffectiveConfig
      summary: Get the redacted effective declarative configuration
      responses:
        "200":
          description: Effective Git-managed configuration and its stable hash
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EffectiveConfig"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /config/schema:
    get:
      operationId: getConfigSchema
      summary: Get the JSON Schema generated from the authoritative Rust configuration types
      responses:
        "200":
          description: JSON Schema for a TacacsServer declarative configuration
          content:
            application/json:
              schema:
                type: object
        "403":
          $ref: "#/components/responses/Forbidden"
  /config/validate:
    post:
      operationId: validateConfig
      summary: Parse and semantically validate a declarative YAML configuration without applying it
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              type: string
              maxLength: 262144
      responses:
        "200":
          description: Validation result, including diagnostics for invalid configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigValidation"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: Configuration exceeds the request limit
  /metrics:
    get:
      operationId: getMetrics
      summary: Get Prometheus metrics
      responses:
        "200":
          description: Prometheus text exposition
          content:
            text/plain:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"
  /nads:
    get:
      operationId: listNads
      summary: List API-owned network access devices
      responses:
        "200":
          description: Active API-owned NADs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NadList"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
    post:
      operationId: createNad
      summary: Create an API-owned network access device
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNad"
      responses:
        "201":
          description: NAD created
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nad"
        "200":
          description: Idempotent replay of an earlier successful creation
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nad"
        "400":
          $ref: "#/components/responses/InvalidHeader"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/InvalidResource"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
  /nads/{nadId}:
    parameters:
      - name: nadId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getNad
      summary: Get an API-owned network access device
      responses:
        "200":
          description: NAD
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nad"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
    patch:
      operationId: updateNad
      summary: Replace mutable fields of an API-owned NAD
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNad"
      responses:
        "200":
          description: NAD updated
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nad"
        "400":
          $ref: "#/components/responses/InvalidHeader"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/InvalidResource"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
    delete:
      operationId: deleteNad
      summary: Soft-delete an API-owned network access device
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: NAD deleted
        "400":
          $ref: "#/components/responses/InvalidHeader"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
components:
  securitySchemes:
    mutualTLS:
      type: mutualTLS
      description: Client certificate identity is mapped to an RBAC subject.
  responses:
    Forbidden:
      description: The authenticated client lacks the required permission.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InvalidRequest:
      description: The request is malformed or fails validation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InvalidHeader:
      description: A required request header is missing or malformed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InvalidResource:
      description: The submitted NAD is invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: A uniqueness, idempotency, or resource-version conflict occurred.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The NAD was not found.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    StoreUnavailable:
      description: The PostgreSQL NAD repository is unavailable.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: "^[A-Za-z0-9_-]+$"
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong resource-version ETag returned by the API, for example `"rv-3"`.
      schema:
        type: string
        pattern: '^"rv-[1-9][0-9]*"$'
  headers:
    ETag:
      description: Strong resource-version validator, for example `"rv-3"`.
      schema:
        type: string
  schemas:
    Status:
      type: object
      additionalProperties: false
      required: [status, version, uptime_seconds, stats]
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
        uptime_seconds:
          type: integer
          format: int64
          minimum: 0
        stats:
          $ref: "#/components/schemas/ServerStats"
    ServerStats:
      type: object
      additionalProperties: false
      required:
        - total_connections
        - active_connections
        - total_authn_requests
        - total_authz_requests
        - total_acct_requests
        - authn_success_rate
        - authz_success_rate
      properties:
        total_connections:
          type: integer
          format: int64
          minimum: 0
        active_connections:
          type: integer
          format: int64
          minimum: 0
        total_authn_requests:
          type: integer
          format: int64
          minimum: 0
        total_authz_requests:
          type: integer
          format: int64
          minimum: 0
        total_acct_requests:
          type: integer
          format: int64
          minimum: 0
        authn_success_rate:
          type: number
          minimum: 0
          maximum: 100
        authz_success_rate:
          type: number
          minimum: 0
          maximum: 100
    Session:
      type: object
      additionalProperties: false
      required: [id, peer_addr, username, start_time, idle_seconds, request_count]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        peer_addr:
          type: string
        username:
          type: [string, "null"]
        start_time:
          type: integer
          format: int64
          minimum: 0
        idle_seconds:
          type: integer
          format: int64
          minimum: 0
        request_count:
          type: integer
          format: int64
          minimum: 0
    Sessions:
      type: object
      additionalProperties: false
      required: [sessions, total]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/Session"
        total:
          type: integer
          minimum: 0
    Policy:
      type: object
      additionalProperties: false
      required: [rule_count, last_loaded, source]
      properties:
        rule_count:
          type: integer
          minimum: 0
        last_loaded:
          type: string
        source:
          type: string
    PolicyUpload:
      type: object
      additionalProperties: false
      required: [policy]
      properties:
        policy:
          type: string
        validate:
          type: boolean
          default: false
    PolicyUploadResult:
      type: object
      additionalProperties: false
      required: [success, message, rule_count]
      properties:
        success:
          type: boolean
        message:
          type: string
        rule_count:
          type: [integer, "null"]
          minimum: 0
    RuntimeConfig:
      type: object
      additionalProperties: false
      required:
        - listen_addrs
        - tls_enabled
        - ldap_enabled
        - policy_source
        - metrics_enabled
        - api_enabled
      properties:
        listen_addrs:
          type: array
          items:
            type: string
        tls_enabled:
          type: boolean
        ldap_enabled:
          type: boolean
        policy_source:
          type: string
        metrics_enabled:
          type: boolean
        api_enabled:
          type: boolean
    EffectiveConfig:
      type: object
      additionalProperties: false
      required: [ownership, mutable, configurationHash, config]
      properties:
        ownership:
          type: string
          const: yaml
        mutable:
          type: boolean
          const: false
        configurationHash:
          type: string
          pattern: "^sha256:[a-f0-9]{64}$"
        config:
          type: object
          description: Typed declarative configuration. Secret values are never resolved or returned.
    ConfigValidation:
      type: object
      additionalProperties: false
      required: [valid, configurationHash, diagnostics]
      properties:
        valid:
          type: boolean
        configurationHash:
          type: [string, "null"]
          pattern: "^sha256:[a-f0-9]{64}$"
        diagnostics:
          type: array
          items:
            $ref: "#/components/schemas/ConfigDiagnostic"
    ConfigDiagnostic:
      type: object
      additionalProperties: false
      required: [severity, code, path, message]
      properties:
        severity:
          type: string
          enum: [error, warning]
        code:
          type: string
        path:
          type: [string, "null"]
        message:
          type: string
    Success:
      type: object
      additionalProperties: false
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string
    NadAuthentication:
      oneOf:
        - $ref: "#/components/schemas/LegacyNadAuthentication"
        - $ref: "#/components/schemas/TlsNadAuthentication"
      discriminator:
        propertyName: mode
        mapping:
          legacy: "#/components/schemas/LegacyNadAuthentication"
          tls: "#/components/schemas/TlsNadAuthentication"
    LegacyNadAuthentication:
      type: object
      additionalProperties: false
      required: [mode, secretRef]
      properties:
        mode:
          const: legacy
        secretRef:
          type: string
          minLength: 1
          maxLength: 1024
          description: Opaque reference to a separately provisioned TACACS shared secret.
    TlsNadAuthentication:
      type: object
      additionalProperties: false
      required: [mode, certificateIdentities]
      properties:
        mode:
          const: tls
        certificateIdentities:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 512
    CreateNad:
      type: object
      additionalProperties: false
      required: [name, sourceAddress, authentication]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 253
          pattern: "^[a-z0-9][a-z0-9.-]*$"
        description:
          type: [string, "null"]
          maxLength: 1024
        sourceAddress:
          type: string
          format: ip
        authentication:
          $ref: "#/components/schemas/NadAuthentication"
    UpdateNad:
      type: object
      additionalProperties: false
      required: [sourceAddress, authentication]
      properties:
        description:
          type: [string, "null"]
          maxLength: 1024
        sourceAddress:
          type: string
          format: ip
        authentication:
          $ref: "#/components/schemas/NadAuthentication"
    Nad:
      allOf:
        - $ref: "#/components/schemas/CreateNad"
        - type: object
          required:
            - nadId
            - ownership
            - resourceVersion
            - createdAt
            - createdBy
            - updatedAt
            - updatedBy
          properties:
            nadId:
              type: string
              format: uuid
            ownership:
              const: api
            resourceVersion:
              type: integer
              minimum: 1
            createdAt:
              type: string
              format: date-time
            createdBy:
              type: string
            updatedAt:
              type: string
              format: date-time
            updatedBy:
              type: string
            deletedAt:
              type: [string, "null"]
              format: date-time
            deletedBy:
              type: [string, "null"]
            reconciliation:
              oneOf:
                - $ref: "#/components/schemas/NadReconciliation"
                - type: "null"
    NadReconciliation:
      type: object
      additionalProperties: false
      required: [nadId, resourceVersion, state, reason]
      properties:
        nadId:
          type: string
          format: uuid
        resourceVersion:
          type: integer
          minimum: 1
        state:
          type: string
          enum: [active, conflict, secretUnavailable]
        reason:
          type: [string, "null"]
    NadList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Nad"
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, correlation_id]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        correlation_id:
          type: string

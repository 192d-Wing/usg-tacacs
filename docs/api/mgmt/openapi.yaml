openapi: 3.1.1
info:
  title: USG TACACS Management API
  version: 1.0.0
  description: Administrative API for operating a USG TACACS server. This contract does not expose JIT password lease operations.
servers:
  - url: https://tacacs.example.mil:8443/api/mgmt/v1
tags:
  - name: Status
    description: Service health, readiness, and version information.
  - name: Sessions
    description: Active TACACS session inspection and termination.
  - name: Policy
    description: Authorization policy inspection, replacement, and reload.
  - name: Operations
    description: Durable asynchronous management operation status.
  - name: Configuration
    description: Redacted runtime configuration, schema, and validation.
  - name: Metrics
    description: Prometheus management-plane telemetry.
  - name: NADs
    description: Network access device lifecycle and runtime reconciliation.
  - name: Audit
    description: Forensic NAD evidence export and integrity verification.
security:
  - mutualTLS: []
paths:
  /status:
    get:
      tags: [Status]
      operationId: getStatus
      summary: Get server status
      responses:
        "200":
          description: Server status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "403":
          $ref: "#/components/responses/Forbidden"
  /sessions:
    get:
      tags: [Sessions]
      operationId: listSessions
      summary: List active TACACS sessions
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sessions"
        "403":
          $ref: "#/components/responses/Forbidden"
  /sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    delete:
      tags: [Sessions]
      operationId: deleteSession
      summary: Terminate an active TACACS session
      responses:
        "204":
          description: Session terminated
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /policy:
    get:
      tags: [Policy]
      operationId: getPolicy
      summary: Get the active authorization policy
      responses:
        "200":
          description: Active policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Policy]
      operationId: replacePolicy
      summary: Validate and replace the authorization policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyUpload"
      responses:
        "200":
          description: Policy replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyUploadResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Policy upload is disabled by authoritative declarative configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyUploadResult"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
  /policy/reload:
    post:
      tags: [Policy]
      operationId: reloadPolicy
      summary: Reload the policy from its configured source
      responses:
        "202":
          description: Reload requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
  /operations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Operations]
      operationId: getOperation
      summary: Get the current result of an asynchronous management operation
      responses:
        "200":
          description: Operation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /config:
    get:
      tags: [Configuration]
      operationId: getRuntimeConfig
      summary: Get the redacted runtime configuration
      responses:
        "200":
          description: Redacted configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeConfig"
        "403":
          $ref: "#/components/responses/Forbidden"
  /config/effective:
    get:
      tags: [Configuration]
      operationId: getEffectiveConfig
      summary: Get the redacted effective declarative configuration
      responses:
        "200":
          description: Effective Git-managed configuration and its stable hash
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EffectiveConfig"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /config/schema:
    get:
      tags: [Configuration]
      operationId: getConfigSchema
      summary: Get the JSON Schema generated from the authoritative Rust configuration types
      responses:
        "200":
          description: JSON Schema for a TacacsServer declarative configuration
          content:
            application/json:
              schema:
                type: object
        "403":
          $ref: "#/components/responses/Forbidden"
  /config/validate:
    post:
      tags: [Configuration]
      operationId: validateConfig
      summary: Parse and semantically validate a declarative YAML configuration without applying it
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              type: string
              maxLength: 262144
      responses:
        "200":
          description: Validation result, including diagnostics for invalid configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigValidation"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: Configuration exceeds the request limit
  /metrics:
    get:
      tags: [Metrics]
      operationId: getMetrics
      summary: Get Prometheus metrics
      responses:
        "200":
          description: Prometheus text exposition
          content:
            text/plain:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"
  /audit/nads:
    get:
      tags: [Audit]
      operationId: listNadAuditEvents
      summary: Export NAD management audit evidence
      description: >
        Returns a bounded chronological page from the append-only,
        hash-chained, HMAC-authenticated NAD mutation log.
      parameters:
        - name: nadId
          in: query
          schema:
            type: string
            format: uuid
        - name: correlationId
          in: query
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          schema:
            type: string
            enum: [create, update, delete]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 1000000
            default: 0
      responses:
        "200":
          description: NAD audit evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NadAuditPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/InvalidResource"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
  /audit/nads/verify:
    get:
      tags: [Audit]
      operationId: verifyNadAuditEvents
      summary: Verify a page of the NAD audit chain
      description: >
        Recomputes event hashes, verifies HMAC signatures in constant time,
        validates chain continuity across the page boundary, and checks signed
        resource metadata. Continue at the next offset until complete is true.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 1000
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 1000000
            default: 0
      responses:
        "200":
          description: Verification report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NadAuditVerification"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/InvalidResource"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
  /nads:
    get:
      tags: [NADs]
      operationId: listNads
      summary: List API-owned network access devices
      parameters:
        - name: namePrefix
          in: query
          description: Canonical lowercase NAD name prefix.
          schema:
            type: string
            minLength: 1
            maxLength: 253
            pattern: "^[a-z0-9.-]+$"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 1000000
            default: 0
      responses:
        "200":
          description: Active API-owned NADs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NadList"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
    post:
      tags: [NADs]
      operationId: createNad
      summary: Create an API-owned network access device
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNad"
      responses:
        "201":
          description: NAD created
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nad"
        "200":
          description: Idempotent replay of an earlier successful creation
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nad"
        "400":
          $ref: "#/components/responses/InvalidHeader"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/InvalidResource"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
  /nads/inventory:
    get:
      tags: [NADs]
      operationId: listNadInventory
      summary: List YAML-owned and API-owned network access devices
      description: >
        Returns a unified read-only inventory. YAML-owned entries are immutable
        through this API; API-owned entries include their runtime reconciliation
        status.
      responses:
        "200":
          description: Unified NAD inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NadInventory"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/InvalidResource"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
  /nads/reconciliation:
    get:
      tags: [NADs]
      operationId: getNadReconciliation
      summary: Query API-owned NAD runtime reconciliation
      description: >
        Returns aggregate counts for the complete current snapshot and a
        bounded page of statuses. When state is supplied, total and items
        describe only the matching statuses.
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum: [active, conflict, secretUnavailable]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 1000000
            default: 0
      responses:
        "200":
          description: Current reconciliation snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NadReconciliationPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/InvalidResource"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
  /nads/{nadId}:
    parameters:
      - name: nadId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [NADs]
      operationId: getNad
      summary: Get an API-owned network access device
      responses:
        "200":
          description: NAD
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nad"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
    patch:
      tags: [NADs]
      operationId: updateNad
      summary: Replace mutable fields of an API-owned NAD
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNad"
      responses:
        "200":
          description: NAD updated
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nad"
        "400":
          $ref: "#/components/responses/InvalidHeader"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/InvalidResource"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
    delete:
      tags: [NADs]
      operationId: deleteNad
      summary: Soft-delete an API-owned network access device
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: NAD deleted
        "400":
          $ref: "#/components/responses/InvalidHeader"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/StoreUnavailable"
components:
  securitySchemes:
    mutualTLS:
      type: mutualTLS
      description: Client certificate identity is mapped to an RBAC subject.
  responses:
    Forbidden:
      description: The authenticated client lacks the required permission.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InvalidRequest:
      description: The request is malformed or fails validation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InvalidHeader:
      description: A required request header is missing or malformed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InvalidResource:
      description: The submitted NAD is invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: A uniqueness, idempotency, or resource-version conflict occurred.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The NAD was not found.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    StoreUnavailable:
      description: The PostgreSQL NAD repository is unavailable.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: "^[A-Za-z0-9_-]+$"
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong resource-version ETag returned by the API, for example `"rv-3"`.
      schema:
        type: string
        pattern: '^"rv-[1-9][0-9]*"$'
  headers:
    ETag:
      description: Strong resource-version validator, for example `"rv-3"`.
      schema:
        type: string
  schemas:
    Status:
      type: object
      additionalProperties: false
      required: [status, version, uptime_seconds, stats]
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
        uptime_seconds:
          type: integer
          format: int64
          minimum: 0
        stats:
          $ref: "#/components/schemas/ServerStats"
    ServerStats:
      type: object
      additionalProperties: false
      required:
        - total_connections
        - active_connections
        - total_authn_requests
        - total_authz_requests
        - total_acct_requests
        - authn_success_rate
        - authz_success_rate
      properties:
        total_connections:
          type: integer
          format: int64
          minimum: 0
        active_connections:
          type: integer
          format: int64
          minimum: 0
        total_authn_requests:
          type: integer
          format: int64
          minimum: 0
        total_authz_requests:
          type: integer
          format: int64
          minimum: 0
        total_acct_requests:
          type: integer
          format: int64
          minimum: 0
        authn_success_rate:
          type: number
          minimum: 0
          maximum: 100
        authz_success_rate:
          type: number
          minimum: 0
          maximum: 100
    Session:
      type: object
      additionalProperties: false
      required: [id, peer_addr, username, start_time, idle_seconds, request_count]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        peer_addr:
          type: string
        username:
          type: [string, "null"]
        start_time:
          type: integer
          format: int64
          minimum: 0
        idle_seconds:
          type: integer
          format: int64
          minimum: 0
        request_count:
          type: integer
          format: int64
          minimum: 0
    Sessions:
      type: object
      additionalProperties: false
      required: [sessions, total]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/Session"
        total:
          type: integer
          minimum: 0
    Policy:
      type: object
      additionalProperties: false
      required: [rule_count, last_loaded, source]
      properties:
        rule_count:
          type: integer
          minimum: 0
        last_loaded:
          type: string
        source:
          type: string
    PolicyUpload:
      type: object
      additionalProperties: false
      required: [policy]
      properties:
        policy:
          type: string
        validate:
          type: boolean
          default: false
    PolicyUploadResult:
      type: object
      additionalProperties: false
      required: [success, message, rule_count]
      properties:
        success:
          type: boolean
        message:
          type: string
        rule_count:
          type: [integer, "null"]
          minimum: 0
    RuntimeConfig:
      type: object
      additionalProperties: false
      required:
        - listen_addrs
        - tls_enabled
        - ldap_enabled
        - policy_source
        - metrics_enabled
        - api_enabled
      properties:
        listen_addrs:
          type: array
          items:
            type: string
        tls_enabled:
          type: boolean
        ldap_enabled:
          type: boolean
        policy_source:
          type: string
        metrics_enabled:
          type: boolean
        api_enabled:
          type: boolean
    EffectiveConfig:
      type: object
      additionalProperties: false
      required: [ownership, mutable, configurationHash, config]
      properties:
        ownership:
          type: string
          const: yaml
        mutable:
          type: boolean
          const: false
        configurationHash:
          type: string
          pattern: "^sha256:[a-f0-9]{64}$"
        config:
          type: object
          description: Typed declarative configuration. Secret values are never resolved or returned.
    ConfigValidation:
      type: object
      additionalProperties: false
      required: [valid, configurationHash, diagnostics]
      properties:
        valid:
          type: boolean
        configurationHash:
          type: [string, "null"]
          pattern: "^sha256:[a-f0-9]{64}$"
        diagnostics:
          type: array
          items:
            $ref: "#/components/schemas/ConfigDiagnostic"
    ConfigDiagnostic:
      type: object
      additionalProperties: false
      required: [severity, code, path, message]
      properties:
        severity:
          type: string
          enum: [error, warning]
        code:
          type: string
        path:
          type: [string, "null"]
        message:
          type: string
    Operation:
      type: object
      additionalProperties: false
      required:
        - operationId
        - kind
        - status
        - submittedAt
        - completedAt
        - error
      properties:
        operationId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [authorizationPolicyReload]
        status:
          type: string
          enum: [running, succeeded, failed]
        submittedAt:
          type: string
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
        error:
          type: [string, "null"]
    NadAuthentication:
      oneOf:
        - $ref: "#/components/schemas/LegacyNadAuthentication"
        - $ref: "#/components/schemas/TlsNadAuthentication"
      discriminator:
        propertyName: mode
        mapping:
          legacy: "#/components/schemas/LegacyNadAuthentication"
          tls: "#/components/schemas/TlsNadAuthentication"
    LegacyNadAuthentication:
      type: object
      additionalProperties: false
      required: [mode, secretRef]
      properties:
        mode:
          const: legacy
        secretRef:
          type: string
          minLength: 1
          maxLength: 1024
          description: Opaque reference to a separately provisioned TACACS shared secret.
    TlsNadAuthentication:
      type: object
      additionalProperties: false
      required: [mode, certificateIdentities]
      properties:
        mode:
          const: tls
        certificateIdentities:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 512
    CreateNad:
      type: object
      additionalProperties: false
      required: [name, sourceAddress, authentication]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 253
          pattern: "^[a-z0-9][a-z0-9.-]*$"
        description:
          type: [string, "null"]
          maxLength: 1024
        sourceAddress:
          type: string
          format: ip
        authentication:
          $ref: "#/components/schemas/NadAuthentication"
    UpdateNad:
      type: object
      additionalProperties: false
      required: [sourceAddress, authentication]
      properties:
        description:
          type: [string, "null"]
          maxLength: 1024
        sourceAddress:
          type: string
          format: ip
        authentication:
          $ref: "#/components/schemas/NadAuthentication"
    Nad:
      allOf:
        - $ref: "#/components/schemas/CreateNad"
        - type: object
          required:
            - nadId
            - ownership
            - resourceVersion
            - createdAt
            - createdBy
            - updatedAt
            - updatedBy
          properties:
            nadId:
              type: string
              format: uuid
            ownership:
              const: api
            resourceVersion:
              type: integer
              minimum: 1
            createdAt:
              type: string
              format: date-time
            createdBy:
              type: string
            updatedAt:
              type: string
              format: date-time
            updatedBy:
              type: string
            deletedAt:
              type: [string, "null"]
              format: date-time
            deletedBy:
              type: [string, "null"]
            reconciliation:
              oneOf:
                - $ref: "#/components/schemas/NadReconciliation"
                - type: "null"
    NadReconciliation:
      type: object
      additionalProperties: false
      required: [nadId, resourceVersion, state, reason]
      properties:
        nadId:
          type: string
          format: uuid
        resourceVersion:
          type: integer
          minimum: 1
        state:
          type: string
          enum: [active, conflict, secretUnavailable]
        reason:
          type: [string, "null"]
    NadReconciliationPage:
      type: object
      additionalProperties: false
      required:
        - reconciledAt
        - total
        - active
        - conflict
        - secretUnavailable
        - items
        - nextOffset
      properties:
        reconciledAt:
          type: string
          format: date-time
        total:
          type: integer
          minimum: 0
        active:
          type: integer
          minimum: 0
        conflict:
          type: integer
          minimum: 0
        secretUnavailable:
          type: integer
          minimum: 0
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/NadReconciliation"
        nextOffset:
          type: [integer, "null"]
          minimum: 0
    NadList:
      type: object
      additionalProperties: false
      required: [items, nextOffset]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/Nad"
        nextOffset:
          type: [integer, "null"]
          minimum: 0
    NadAuditEvent:
      type: object
      additionalProperties: false
      required:
        - hashVersion
        - eventId
        - occurredAt
        - correlationId
        - actor
        - action
        - nadId
        - resourceVersion
        - beforeState
        - afterState
        - previousEventHash
        - eventHash
        - hmacSignature
      properties:
        hashVersion:
          type: integer
          enum: [1, 2]
          description: Version 1 is legacy; version 2 authenticates all forensic metadata.
        eventId:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        correlationId:
          type: string
          format: uuid
        actor:
          type: string
          minLength: 1
          maxLength: 512
        action:
          type: string
          enum: [create, update, delete]
        nadId:
          type: string
          format: uuid
        resourceVersion:
          type: integer
          minimum: 1
        beforeState:
          type: [object, "null"]
        afterState:
          type: object
        previousEventHash:
          type: [string, "null"]
          pattern: "^[0-9a-f]{64}$"
        eventHash:
          type: string
          pattern: "^[0-9a-f]{64}$"
        hmacSignature:
          type: string
          pattern: "^[0-9a-f]{64}$"
    NadAuditPage:
      type: object
      additionalProperties: false
      required: [items, nextOffset]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/NadAuditEvent"
        nextOffset:
          type: [integer, "null"]
          minimum: 0
    NadAuditVerification:
      type: object
      additionalProperties: false
      required:
        - valid
        - checkedEvents
        - offset
        - complete
        - firstEventId
        - lastEventId
        - lastEventHash
        - failureEventId
        - failureCode
      properties:
        valid:
          type: boolean
        checkedEvents:
          type: integer
          minimum: 0
          maximum: 5000
        offset:
          type: integer
          minimum: 0
        complete:
          type: boolean
        firstEventId:
          type: [string, "null"]
          format: uuid
        lastEventId:
          type: [string, "null"]
          format: uuid
        lastEventHash:
          type: [string, "null"]
          pattern: "^[0-9a-f]{64}$"
        failureEventId:
          type: [string, "null"]
          format: uuid
        failureCode:
          type: [string, "null"]
    NadInventory:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NadInventoryItem"
    NadInventoryItem:
      type: object
      additionalProperties: false
      required:
        - nadId
        - name
        - description
        - sourceAddress
        - authentication
        - ownership
        - mutable
        - resourceVersion
        - reconciliation
      properties:
        nadId:
          type: [string, "null"]
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 253
        description:
          type: [string, "null"]
          maxLength: 1024
        sourceAddress:
          type: string
          format: ip
        authentication:
          $ref: "#/components/schemas/NadAuthentication"
        ownership:
          type: string
          enum: [yaml, api]
        mutable:
          type: boolean
        resourceVersion:
          type: [integer, "null"]
          minimum: 1
        reconciliation:
          oneOf:
            - $ref: "#/components/schemas/NadReconciliation"
            - type: "null"
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, correlation_id]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        correlation_id:
          type: string

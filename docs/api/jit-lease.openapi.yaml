openapi: 3.1.1
info:
  title: USG TACACS JITPW Lease API
  version: 1.0.0
  summary: Fail-closed temporary device credential lease management
  description: |
    Management contract between JITPW and USG TACACS. Production deployments
    require TLS 1.3 mutual authentication and RBAC authorization. Passwords are
    write-only, must never be logged, and are never returned by this API.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://usg-tacacs-api.example.mil
security:
  - mutualTls: []
tags:
  - name: JIT leases
paths:
  /api/v1/jit-leases:
    post:
      tags: [JIT leases]
      operationId: createJitLease
      summary: Create a device-bound credential lease
      description: Requires `write:jit-leases` and an authorized JITPW mTLS identity.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJitLeaseRequest'
      responses:
        '201':
          description: Lease created
          headers:
            Location:
              schema:
                type: string
              description: Relative status resource for the lease
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JitLease'
        '200':
          description: Idempotent replay of an existing lease
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JitLease'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '503':
          $ref: '#/components/responses/StoreUnavailable'
  /api/v1/jit-leases/{lease_id}:
    parameters:
      - $ref: '#/components/parameters/LeaseId'
      - $ref: '#/components/parameters/CorrelationId'
    get:
      tags: [JIT leases]
      operationId: getJitLease
      summary: Get non-secret lease metadata
      description: Requires `read:jit-leases`.
      responses:
        '200':
          description: Lease metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JitLease'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/StoreUnavailable'
    delete:
      tags: [JIT leases]
      operationId: revokeJitLease
      summary: Revoke a lease
      description: Requires `write:jit-leases`. Revocation is idempotent.
      responses:
        '204':
          description: Lease is revoked or was already revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/StoreUnavailable'
components:
  securitySchemes:
    mutualTls:
      type: mutualTLS
      description: TLS 1.3 client certificate validated by the configured trust store.
  parameters:
    LeaseId:
      name: lease_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/LeaseId'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Opaque, non-secret key unique to one logical create operation.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[A-Za-z0-9_-]+$'
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[A-Za-z0-9._-]+$'
  schemas:
    LeaseId:
      type: string
      format: uuid
    Eid:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[a-z0-9](?:[a-z0-9.-]{0,126}[a-z0-9])?$'
      examples: [john.e.willman3.mil]
    CreateJitLeaseRequest:
      type: object
      additionalProperties: false
      required:
        - eid
        - icam_subject
        - nad_identity
        - password
        - ttl_seconds
        - authorization_groups
      properties:
        eid:
          $ref: '#/components/schemas/Eid'
        icam_subject:
          type: string
          minLength: 1
          maxLength: 256
          description: Immutable subject identifier from the validated ICAM assertion.
        nad_identity:
          type: string
          minLength: 1
          maxLength: 253
          pattern: '^[A-Za-z0-9](?:[A-Za-z0-9.-]{0,251}[A-Za-z0-9])?$'
          description: Trusted configured identity of exactly one network access device.
        password:
          type: string
          writeOnly: true
          minLength: 24
          maxLength: 128
          description: High-entropy temporary password; accepted once and never logged or returned.
        ttl_seconds:
          type: integer
          minimum: 1
          maximum: 900
          default: 900
        authorization_groups:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9._:@/-]+$'
    JitLease:
      type: object
      additionalProperties: false
      required:
        - lease_id
        - eid
        - icam_subject
        - nad_identity
        - authorization_groups
        - issued_at
        - expires_at
        - status
      properties:
        lease_id:
          $ref: '#/components/schemas/LeaseId'
        eid:
          $ref: '#/components/schemas/Eid'
        icam_subject:
          type: string
          minLength: 1
          maxLength: 256
        nad_identity:
          type: string
          minLength: 1
          maxLength: 253
        authorization_groups:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            type: string
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [active, revoked, expired]
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, correlation_id]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          maxLength: 128
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          maxLength: 64
          pattern: '^[a-z0-9_]+$'
        correlation_id:
          type: string
          minLength: 16
          maxLength: 128
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: A valid mTLS client identity was not established
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The mTLS identity lacks the required permission
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Lease not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: An active lease or idempotency-key conflict exists
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: Request exceeds the configured body limit
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableContent:
      description: Request violates lease policy
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    StoreUnavailable:
      description: Authoritative lease store unavailable; operation failed closed
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
            maximum: 60
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

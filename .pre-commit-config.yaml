# Pre-commit hooks for usg-tacacs. Install with:  pre-commit install
# NIST SP 800-53 Rev. 5: SA-11 (developer testing), IA-5 (secret hygiene).
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: gitleaks (block hardcoded secrets)
        args: ["protect", "--staged", "--config", ".gitleaks.toml", "--redact"]
